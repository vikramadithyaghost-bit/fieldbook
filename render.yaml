# Render blueprint: New → Blueprint → pick this repo. Creates the web service with HTTPS
# and a persistent disk for the SQLite database (a disk needs a paid instance; Starter is enough).
services:
  - type: web
    name: fieldbook
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        sync: false # Render asks for the value when you create the service
      - key: DB_PATH
        value: /var/data/fieldbook.db
    disk:
      name: fieldbook-data
      mountPath: /var/data
      sizeGB: 1
